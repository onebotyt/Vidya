name: VidyaOS Continuous Deployment (GitOps)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository != '' # Runs when triggered on GitHub

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS / Server Room via SSH
        uses: appleboy/ssh-action@v1.0.3
        # Only runs if secrets are configured in GitHub Repo Settings > Secrets
        continue-on-error: true
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /opt/vidyaos || cd ~/vidyaos || exit 1
            git pull origin main
            docker compose up -d --build
            docker image prune -f

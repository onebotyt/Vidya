<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to Coursework &amp; Assignments — VidyaOS</title>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const regId = urlParams.get('id') || urlParams.get('register_id') || urlParams.get('register');
    const target = regId
      ? `/faculty/registers.html?tab=assignments&id=${encodeURIComponent(regId)}`
      : '/faculty/registers.html?tab=assignments';
    window.location.replace(target);
  </script>
</head>
